    - diff_prof_reference_group: SampleGroup
  - integmet:conditionGroup:
    - diff_prof_condition_group: SampleGroup
  - integmet:direction?:
    - diff_prof_direction: G4/G2
  - schema:name?:
    - diff_prof_pair_name: Control_vs_Spinach_2-4hr_post-lunch
  - integmet:pairType*:
    - diff_prof_pair_type: treatment
  - integmet:pairDescribingText?:
    - diff_prof_pair_describing_text: This comparison identifies spinach-specific urinary metabolomic signatures
        by comparing urine samples collected 2-4 hours after spinach consumption to control samples without vegetable
        intake at the same timepoint. The 2-4 hour window represents the peak detection period for vegetable-derived
        metabolites as identified in the study design.
  - integmet:pairDescribingShortText?:
    - diff_prof_pair_describing_short_text: Spinach intake vs no vegetable control at 2-4hr post-lunch
  - integmet:perturbationDescription?:
    - diff_prof_perturbation_description: spinach intake metabolic response at 2-4 hours post-consumption compared
        to no vegetable control in Homo sapiens urine
  - integmet:contrastDescription?:
    - diff_prof_contrast_description: spinach intake metabolic response at 2-4 hours post-consumption compared to
        no vegetable control in urine, examining peak detection window for spinach-derived metabolites in healthy
        individuals
  - integmet:comparisonSummary?:
    - diff_prof_comparison_summary: Homo sapiens, urine, comparing healthy participants without vegetable intake
        and healthy participants after spinach consumption at 2-4 hours post-lunch
  - integmet:comparisonAxis?:
    - diff_prof_comparison_axis: spinach intake effect at peak detection timepoint
  - integmet:biologicalRelevance?:
    - diff_prof_biological_relevance: Identifies spinach-specific urinary metabolomic signatures for assessing plant
        food intake, critical for developing dietary biomarkers
  - integmet:rank?:
    - diff_prof_rank: 1
  - integmet:rankReasoning?:
    - diff_prof_rank_reasoning: 'Highest priority: Control vs spinach at peak detection window (2-4hr) for identifying
        spinach-specific metabolites'
  - integmet:curation?:
    - diff_prof_curation: llm
